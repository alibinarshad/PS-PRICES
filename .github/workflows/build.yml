name: Build PSprices iOS Edition APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/psprices/app
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PSPrices"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.psprices.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.psprices.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-iOS"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="128dp"
              android:height="128dp"
              android:viewportWidth="128"
              android:viewportHeight="128">
              <path
                  android:fillColor="#111317"
                  android:pathData="M32,4 C14.3,4 4,14.3 4,32 L4,96 C4,113.7 14.3,124 32,124 L96,124 C113.7,124 124,113.7 124,96 L124,32 C124,14.3 113.7,4 96,4 Z"/>
              <path
                  android:fillColor="#2D68FF"
                  android:pathData="M24,24h80c4.4,0 8,3.6 8,8v64c0,4.4 -3.6,8 -8,8H24c-4.4,0 -8,-3.6 -8,-8V32c0,-4.4 3.6,-8 8,-8z"/>
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="8"
                  android:strokeLineCap="round"
                  android:pathData="M44,84 L84,44"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M48,50m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M80,78m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="PSprices"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/psprices/app/MainActivity.java
          package com.psprices.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.Window;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.parseColor("#111317"));
                  window.setNavigationBarColor(Color.parseColor("#16181D"));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#111317"));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setUserAgentString(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1"
                  );

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.contains("store.playstation.com") || url.startsWith("market://")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                                  return true;
                              } catch (Exception ignored) {}
                          }
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          // Removes promo banners and headers for an iOS-clean display
                          String jsClean = "javascript:(function() {" +
                              "var banner = document.querySelector('.app-banner, [href*=\"/mobile/\"], [href*=\"apple.com\"]');" +
                              "if(banner) banner.style.display = 'none';" +
                              "})()";
                          view.evaluateJavascript(jsClean, null);
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl("https://psprices.com/");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Build PSprices APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk PSprices-iOS-Edition.apk

      - name: Upload PSprices APK
        uses: actions/upload-artifact@v4
        with:
          name: PSprices-iOS-Edition-APK
          path: PSprices-iOS-Edition.apk
          
